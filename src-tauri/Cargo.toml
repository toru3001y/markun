[package]
name = "markun"
version = "0.2.1"
description = "A quiet desktop reader for local Markdown documents"
authors = ["Markun contributors"]
edition = "2021"

[lib]
name = "markun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
